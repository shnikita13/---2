<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой блог</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Мой блог</h1>

    <!-- Аутентификация -->
    <div id="auth-section">
        <button onclick="showRegister()">Регистрация</button>
        <button onclick="showLogin()">Войти</button>
    </div>

    <!-- Форма регистрации -->
    <div id="register-form" style="display:none;">
        <h2>Регистрация</h2>
        <input type="text" id="reg-username" placeholder="имя пользователя" /><br/>
        <input type="password" id="reg-password" placeholder="пароль" /><br/>
        <button onclick="register()">Зарегистрироваться</button>
        <button onclick="hideForms()">Отменить</button>
        <p id="reg-error" class="error"></p>
    </div>

    <!-- Форма входа -->
    <div id="login-form" style="display:none;">
        <h2>Вход</h2>
        <input type="text" id="login-username" placeholder="имя пользователя" /><br/>
        <input type="password" id="login-password" placeholder="пароль" /><br/>
        <button onclick="login()">Войти</button>
        <button onclick="hideForms()">Отменить</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- Панель залогиненного пользователя -->
    <div id="user-bar" style="display:none;">
        <span id="current-user-label"></span>
        <button id="newPostBtn" onclick="showCreatePost()">Создать пост</button>
        <button id="usersBtn" onclick="toggleUsersList()">Пользователи / Подписки</button>
        <button id="logoutBtn" onclick="logout()">Выйти</button>
    </div>

    <!-- Список пользователей для подписки -->
    <div id="users-list" style="display:none; margin-top:10px;">
        <h2>Пользователи</h2>
        <div id="users-container"></div>
    </div>

    <!-- Создание поста -->
    <div id="create-post" style="display:none; margin-top:20px;">
        <h2>Создать пост</h2>
        <input type="text" id="post-title" placeholder="Заголовок" /><br/>
        <textarea id="post-content" placeholder="Текст поста"></textarea><br/>
        <input type="text" id="post-tags" placeholder="Теги через запятую (например: жизнь, кино)" /><br/>
        <label>
            Видимость:
            <select id="post-visibility">
                <option value="public">Публичный</option>
                <option value="hidden">Скрытый (по запросу)</option>
            </select>
        </label><br/>
        <button onclick="savePost()">Сохранить</button>
        <button onclick="hideCreatePost()">Отмена</button>
    </div>

    <!-- Панель фильтров ленты -->
    <div id="feed-controls" style="display:none; margin-top:20px;">
        <button id="tabAll" class="active" onclick="setFeedMode('all')">Все публичные посты</button>
        <button id="tabFeed" onclick="setFeedMode('subs')">Моя лента (подписки)</button>
        <label style="margin-left:15px;">
            Фильтр по тегу:
            <select id="tag-filter" onchange="loadPosts()">
                <option value="">Все теги</option>
            </select>
        </label>
    </div>

    <!-- Информация о постах -->
    <div id="posts" style="margin-top:20px;"></div>

    <script src="script.js"></script>
</body>
</html>
